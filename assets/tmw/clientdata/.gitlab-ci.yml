stages:
- test

image: debian:stable
before_script:
  - uname -a

testxml:
  stage: test
  script:
  - ./.tools/testxml.sh
  - pwd

pngcheck:
  stage: test
  script:
  - ./.tools/pngcheck.sh

imagemagiccheck:
  stage: test
  script:
  - ./.tools/imagemagiccheck.sh

manaverse:
  stage: test
  tags:
  - amd64
  image: debian:bookworm #2023
  script:
  - ./.tools/manaplus.sh mana/verse master pkg_deb manaverse.log
  artifacts:
    paths:
    - logs
    when: always
    expire_in: 3 week

old_manaplus:
  stage: test
  tags:
  - amd64
  image: debian:bookworm #2023
  script:
  - ./.tools/manaplus.sh mana/verse old_manaplus_for_CI pkg_deb manaplus.log
  artifacts:
    paths:
    - logs
    when: always
    expire_in: 3 week

newlines:
  stage: test
  tags:
  - lightweight
  script:
  - ./.tools/newlines.sh
  artifacts:
    paths:
    - shared
    when: always
    expire_in: 3 week

.contributors:
  stage: test
  script:
  - ./.tools/contributors.sh
  - pwd

licensecheck:
  stage: test
  tags:
  - lightweight
  script:
  - ./.tools/licensecheck.sh
  allow_failure: true

